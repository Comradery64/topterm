name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14 # Apple Silicon runner
            npm-pkg: darwin-arm64
          - os: macos-13 # Intel runner
            npm-pkg: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version && cargo --version

      - name: Build
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topterm-${{ matrix.npm-pkg }}
          path: target/release/topterm
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topterm-darwin-arm64
          path: npm/darwin-arm64/bin

      - name: Download x64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topterm-darwin-x64
          path: npm/darwin-x64/bin

      - name: Make binaries executable
        run: |
          chmod +x npm/darwin-arm64/bin/topterm
          chmod +x npm/darwin-x64/bin/topterm

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Sync package versions with tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set version="$VERSION" --prefix npm/darwin-arm64
          npm pkg set version="$VERSION" --prefix npm/darwin-x64
          npm pkg set version="$VERSION" --prefix npm/topterm
          npm pkg set optionalDependencies.topterm-darwin-arm64="$VERSION" --prefix npm/topterm
          npm pkg set optionalDependencies.topterm-darwin-x64="$VERSION" --prefix npm/topterm

      - name: Publish platform packages
        run: |
          npm publish --access public npm/darwin-arm64
          npm publish --access public npm/darwin-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: npm publish --access public npm/topterm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
